[project]
name = "wer-is-unaware"
version = "0.1.0"
description = "LLM transcript alignment and evaluation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.35.0",
  "num2words>=0.5.13",
  "jiwer>=3.0",
  "nltk>=3.8",
  "rouge-score>=0.1",
  "sacrebleu>=2.3",
  "pandas>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
learned-semantic = ["sentence-transformers>=2.2", "numpy>=1.24", "bert-score>=0.3.13"]
bleurt = ["bleurt @ git+https://github.com/google-research/bleurt.git", "tensorflow>=2.16,<2.20"]
judge = ["dspy>=3.0,<3.1", "scikit-learn>=1.0", "google-cloud-aiplatform>=1.38", "boto3>=1.28"]
data-prep = ["textgrid>=1.5", "soxr>=0.3", "numpy>=1.24"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]
all-metrics = ["wer-is-unaware[learned-semantic,bleurt]"]
all = ["wer-is-unaware[all-metrics,judge,data-prep,plot,dev]"]

[tool.setuptools.packages.find]
include = ["metrics*", "llm_judge*", "alignment*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
